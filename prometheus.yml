# ============================================================
# Prometheus Server 配置文件
# 放在 Prometheus 安装目录下，替换默认的 prometheus.yml
# 或通过 docker -v 挂载: -v ./prometheus.yml:/etc/prometheus/prometheus.yml
# 注意：alert.rules.yml 也要一起拷到同目录，否则 rule_files 找不到
# ============================================================

global:
  scrape_interval: 15s       # 每 15 秒采集一次（Grafana 5s 刷新够用）
  evaluation_interval: 15s

# 告警规则文件
rule_files:
  - "alert.rules.yml"

# 采集目标配置
scrape_configs:

  # ========== 秒杀系统 Spring Boot 应用 ==========
  - job_name: "hm-dianping"
    metrics_path: "/actuator/prometheus"    # Spring Boot Actuator 暴露的 Prometheus 端点
    static_configs:
      - targets: ["host.docker.internal:8081"]   # Docker 中访问宿主机
        labels:
          application: "hm-dianping"
          env: "production"

      # 如果 Prometheus 和 Spring Boot 都在本机直接运行，用下面这个：
      # - targets: ["localhost:8081"]

  # ========== Prometheus 自身监控（可选） ==========
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

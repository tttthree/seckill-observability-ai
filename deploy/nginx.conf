worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;

    # ==================== 限流规则 ====================
    # 秒杀接口：单 IP 每秒 500 次
    limit_req_zone $binary_remote_addr zone=seckill:10m rate=500r/s;
    # 指标接口：单 IP 每秒 10 次（Dashboard 自动刷新）
    limit_req_zone $binary_remote_addr zone=metrics:10m rate=10r/s;

    server {
        listen       8080;
        server_name  localhost;

        # ==================== 静态文件 ====================
        location / {
            root   html/hmdp;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # ==================== 秒杀接口（限流） ====================
        location /api/voucher-order/seckill/ {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            rewrite /api(/.*) $1 break;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://127.0.0.1:8081;

            limit_req zone=seckill burst=1 nodelay;
            limit_req_status 429;
        }

        # ==================== 指标接口（限流） ====================
        location /api/metrics/ {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            rewrite /api(/.*) $1 break;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://127.0.0.1:8081;

            limit_req zone=metrics burst=5 nodelay;
            limit_req_status 429;
        }

        # ==================== 通用 API（不限流） ====================
        location /api {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            rewrite /api(/.*) $1 break;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://127.0.0.1:8081;
        }
    }

}

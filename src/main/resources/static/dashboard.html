<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀运行监控 - Seckill Observability</title>
    <style>
        :root {
            --bg: #09090b;
            --bg-raised: #131317;
            --border: #23232a;
            --border-strong: #2e2e38;
            --text: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #61616b;
            --accent: #60a5fa;
            --green: #34d399;
            --yellow: #fbbf24;
            --orange: #fb923c;
            --red: #f87171;
            --radius: 8px;
            --radius-pill: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 顶栏：极简 ===== */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; height: 56px;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            background: rgba(9,9,11,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .topbar-logo {
            width: 26px; height: 26px; border-radius: 6px;
            background: var(--accent);
            font-size: 13px; font-weight: 700; color: #09090b;
            display: flex; align-items: center; justify-content: center;
        }
        .topbar-title { font-size: 13px; font-weight: 600; letter-spacing: -0.2px; }
        .topbar-right { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-muted); }

        .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
        .dot.loading { animation: pulse 1s infinite; background: var(--yellow); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

        .btn {
            padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius);
            background: transparent; color: var(--text-secondary); font-size: 11px; cursor: pointer;
            transition: all 0.15s ease; font-family: inherit;
        }
        .btn:hover { border-color: var(--text-muted); color: var(--text); }
        .btn:active { transform: scale(0.98); }
        .btn-pri { background: var(--accent); border-color: var(--accent); color: #09090b; font-weight: 600; }
        .btn-pri:hover { background: #93bbfd; color: #09090b; }
        .btn-danger { color: var(--red); border-color: rgba(248,113,113,0.2); }
        .btn-danger:hover { background: rgba(248,113,113,0.08); border-color: var(--red); }
        .btn-ghost { border-color: transparent; padding: 4px 8px; }

        .auto-tag {
            font-size: 10px; padding: 1px 7px; border-radius: var(--radius-pill);
            background: rgba(52,211,153,0.1); color: var(--green);
        }
        .auto-tag.off { background: rgba(113,113,122,0.1); color: var(--text-muted); }

        /* ===== 主内容区 ===== */
        .content {
            max-width: 100%; margin: 0 auto; padding: 32px 40px 48px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* ===== AI 报告卡已随旧 AI metrics 分析链移除（见 Phase 1） ===== */

        .empty-state {
            font-size: 13px; color: var(--text-muted);
            padding: 24px; text-align: center;
            background: rgba(255,255,255,0.01); border-radius: var(--radius);
        }

        /* ===== 底部信息条 ===== */
        .infobar {
            display: flex; align-items: center; gap: 28px;
            padding: 12px 20px;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 11px; color: var(--text-muted);
        }
        .infobar-stat { display: flex; align-items: center; gap: 6px; }
        .infobar-stat strong {
            font-family: 'Geist Mono', 'SF Mono', monospace;
            font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
            font-variant-numeric: tabular-nums;
        }
        .infobar-stat strong.good { color: var(--green); }
        .infobar-stat strong.warn { color: var(--yellow); }
        .infobar-stat strong.bad  { color: var(--red); }
        .infobar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        .infobar-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        /* 骨架屏 */
        .skel {
            background: linear-gradient(90deg, #1c1c21 25%, #25252d 50%, #1c1c21 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        .skel-line { height: 12px; margin-bottom: 8px; }
        .skel-line-sm { height: 10px; width: 50%; }

        /* toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 10px 18px; border-radius: var(--radius);
            font-size: 12px; font-weight: 600;
            background: var(--bg-raised); border: 1px solid var(--border-strong);
            color: var(--text); opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none; z-index: 200;
        }
        .toast.show { opacity: 1; }
        .toast.ok  { border-color: rgba(52,211,153,0.3); color: var(--green); }
        .toast.err { border-color: rgba(248,113,113,0.3); color: var(--red); }

        /* 响应式 */
        @media (max-width: 768px) {
            .content { padding: 16px 12px 32px; gap: 20px; }
            .infobar { flex-wrap: wrap; gap: 14px; }
            .infobar-stat strong { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .skel { animation: none; }
            .dot.loading { animation: none; }
        }
    </style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
    <div class="topbar-left">
        <div class="topbar-logo">S</div>
        <div class="topbar-title">秒杀监控台</div>
    </div>
    <div class="topbar-right">
        <span id="lastRefresh">--</span>
        <span class="dot" id="statusDot"></span>
        <button class="btn btn-ghost" id="autoToggle" onclick="toggleAutoRefresh()">
            <span id="autoLabel">自动</span>
            <span class="auto-tag off" id="autoBadge">OFF</span>
        </button>
        <button class="btn btn-pri" onclick="refreshAll()">刷新</button>
    </div>
</header>

<!-- ===== 内容 ===== -->
<div class="content">

    <!-- ===== 底部信息条 ===== -->
    <div class="infobar" id="infobar">
        <!-- key numbers filled by JS -->
    </div>

</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<script>
const METRICS_URL   = '/metrics/seckill';
const QUEUE_URL     = '/admin/health/queue';

let autoRefreshInterval = null;
const INTERVAL_SEC = 10;

// ===== 入口 =====
document.addEventListener('DOMContentLoaded', () => {
    fetchMetrics();
    fetchQueueHealth();
});

async function refreshAll() {
    setLoading(true);
    await Promise.all([fetchMetrics(), fetchQueueHealth()]);
    setLoading(false);
    updateTimestamp();
}

// ===== 数据获取 =====
async function fetchMetrics() {
    try {
        const r = await fetch(METRICS_URL);
        if (!r.ok) throw new Error(`${r.status}`);
        renderMetrics(await r.json());
    } catch(e) { console.error(e); }
}

async function fetchQueueHealth() {
    try {
        const r = await fetch(QUEUE_URL);
        if (r.ok) renderQueue(await r.json());
    } catch(e) {}
}

// ===== 渲染：底部信息条 =====
function renderMetrics(d) {
    const rt  = d.runtime_metrics || {};

    const stats = [
        { label: '请求',  value: fmt(rt.total_requests),   cls: '' },
        { label: '成交',  value: fmt(rt.order_success),    cls: rt.order_success > 0 ? 'good' : '' },
        { label: '库存失败', value: fmt(rt.stock_fail),    cls: rt.stock_fail > 0 ? 'warn' : '' },
        { label: '拦截',  value: fmt(rt.duplicate_request), cls: '' },
        { label: '异常',  value: fmt(rt.infra_fail),       cls: rt.infra_fail > 0 ? 'bad' : 'good' },
        { label: '消费者', value: rt.consumer_alive ? 'UP' : 'DOWN', cls: rt.consumer_alive ? 'good' : 'bad' },
    ];

    document.getElementById('infobar').innerHTML = stats.map(s =>
        `<div class="infobar-stat">
            <strong class="${s.cls}">${s.value}</strong>
            <span>${s.label}</span>
        </div>`
    ).join('') + `<div class="infobar-right">
        <span class="infobar-label">PENDING</span>
        <strong id="qPending">--</strong>
        <span class="infobar-label">死信</span>
        <strong id="qDead">--</strong>
        <button class="btn btn-ghost" onclick="opsReset()" title="重置指标">重置</button>
        <button class="btn btn-ghost" onclick="opsReconcile()" title="手动对账">对账</button>
    </div>`;
}

// ===== 队列数据更新 =====
let lastMetricsData = null;
function renderQueue(d) {
    const p = d.stream_pending;
    const dead = d.dead_letter_size;
    const elP = document.getElementById('qPending');
    const elD = document.getElementById('qDead');
    if (elP) {
        elP.textContent = p != null ? fmt(p) : '--';
        elP.className = p > 1000 ? 'bad' : (p > 500 ? 'warn' : 'good');
    }
    if (elD) {
        elD.textContent = dead != null ? fmt(dead) : '--';
        elD.className = dead > 100 ? 'bad' : (dead > 10 ? 'warn' : 'good');
    }
}

// ===== 运维操作 =====
async function ops(url, label) {
    const t = document.getElementById('toast');
    try {
        let adminToken = sessionStorage.getItem('hmdpAdminToken');
        if (!adminToken) {
            adminToken = prompt('请输入管理员令牌');
            if (!adminToken) return;
            sessionStorage.setItem('hmdpAdminToken', adminToken);
        }
        const r = await fetch(url, {
            method:'POST',
            headers: { 'X-Admin-Token': adminToken }
        });
        if (r.status === 403) sessionStorage.removeItem('hmdpAdminToken');
        const d = await r.json();
        t.textContent = d.success ? `${label} 完成` : `${label} 失败: ${d.message||d.errorMsg||''}`;
        t.className = d.success ? 'toast ok show' : 'toast err show';
    } catch(e) {
        t.textContent = `${label} 异常`;
        t.className = 'toast err show';
    }
    setTimeout(() => t.className = 'toast', 2500);
    setTimeout(refreshAll, 600);
}
function opsReset()     { if(confirm('重置所有秒杀指标计数器？')) ops('/admin/metrics/reset', '指标重置'); }
function opsReconcile() { ops('/admin/reconcile/trigger', '手动对账'); }

// ===== 工具 =====
function fmt(v) {
    if (v == null || isNaN(v)) return '--';
    return Number(v).toLocaleString('zh-CN', { maximumFractionDigits:1 });
}
function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s; return d.innerHTML;
}

// ===== UI =====
function setLoading(v) {
    document.getElementById('statusDot').className = 'dot' + (v ? ' loading' : '');
}
function updateTimestamp() {
    document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString('zh-CN', { hour12:false });
    document.getElementById('statusDot').className = 'dot';
}
function toggleAutoRefresh() {
    const tag = document.getElementById('autoBadge');
    const label = document.getElementById('autoLabel');
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval); autoRefreshInterval = null;
        tag.textContent = 'OFF'; tag.className = 'auto-tag off'; label.textContent = '自动';
    } else {
        autoRefreshInterval = setInterval(refreshAll, INTERVAL_SEC * 1000);
        tag.textContent = INTERVAL_SEC + 's'; tag.className = 'auto-tag'; label.textContent = '自动';
    }
}
</script>
</body>
</html>

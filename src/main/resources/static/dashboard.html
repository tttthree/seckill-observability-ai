<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 运维台 - hm-dianping</title>
    <style>
        :root {
            --bg: #09090b;
            --bg-raised: #131317;
            --border: #23232a;
            --border-strong: #2e2e38;
            --text: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #61616b;
            --accent: #60a5fa;
            --green: #34d399;
            --yellow: #fbbf24;
            --orange: #fb923c;
            --red: #f87171;
            --radius: 8px;
            --radius-pill: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 顶栏：极简 ===== */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; height: 56px;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            background: rgba(9,9,11,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .topbar-logo {
            width: 26px; height: 26px; border-radius: 6px;
            background: var(--accent);
            font-size: 13px; font-weight: 700; color: #09090b;
            display: flex; align-items: center; justify-content: center;
        }
        .topbar-title { font-size: 13px; font-weight: 600; letter-spacing: -0.2px; }
        .topbar-right { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-muted); }

        .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
        .dot.loading { animation: pulse 1s infinite; background: var(--yellow); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

        .btn {
            padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius);
            background: transparent; color: var(--text-secondary); font-size: 11px; cursor: pointer;
            transition: all 0.15s ease; font-family: inherit;
        }
        .btn:hover { border-color: var(--text-muted); color: var(--text); }
        .btn:active { transform: scale(0.98); }
        .btn-pri { background: var(--accent); border-color: var(--accent); color: #09090b; font-weight: 600; }
        .btn-pri:hover { background: #93bbfd; color: #09090b; }
        .btn-danger { color: var(--red); border-color: rgba(248,113,113,0.2); }
        .btn-danger:hover { background: rgba(248,113,113,0.08); border-color: var(--red); }
        .btn-ghost { border-color: transparent; padding: 4px 8px; }

        .auto-tag {
            font-size: 10px; padding: 1px 7px; border-radius: var(--radius-pill);
            background: rgba(52,211,153,0.1); color: var(--green);
        }
        .auto-tag.off { background: rgba(113,113,122,0.1); color: var(--text-muted); }

        /* ===== 主内容区 ===== */
        .content {
            max-width: 100%; margin: 0 auto; padding: 32px 40px 48px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* ===== AI 报告卡 — 唯一主角 ===== */
        .report {
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        /* 报告头部：大状态 */
        .report-head {
            padding: 36px 40px 32px;
            display: flex; align-items: flex-start; justify-content: space-between;
        }
        .report-status-col { display: flex; flex-direction: column; gap: 6px; }
        .report-status-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-muted); font-weight: 600;
        }
        .report-status-value {
            font-size: 48px; font-weight: 700; letter-spacing: -2.5px; line-height: 1;
        }
        .status-NORMAL    { color: var(--green); }
        .status-SATURATED { color: var(--yellow); }
        .status-DEGRADED  { color: var(--orange); }
        .status-INFRA_FAIL,.status-CRITICAL { color: var(--red); }
        .status-UNKNOWN   { color: var(--text-muted); }

        .report-status-secondary {
            font-size: 12px; color: var(--text-muted); margin-top: 4px;
        }
        .report-actions { display: flex; gap: 8px; align-items: center; }

        /* 信号灯行 */
        .report-signals {
            margin: 0 40px;
            padding: 14px 0;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .report-signals-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--text-muted); font-weight: 600; margin-right: 4px;
        }
        .signal {
            padding: 4px 12px; border-radius: var(--radius-pill);
            font-size: 11px; font-weight: 600;
        }
        .signal.ok  { background: rgba(52,211,153,0.08); color: var(--green); }
        .signal.warn { background: rgba(251,191,36,0.08); color: var(--yellow); }
        .signal.bad  { background: rgba(248,113,113,0.08); color: var(--red); }

        /* 报告正文 */
        .report-body {
            padding: 0 40px 36px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .report-section-title {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px;
            color: var(--text-muted); font-weight: 600; margin-bottom: 10px;
        }

        /* 因果链 — 叙述式 */
        .causal-chain {
            position: relative;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .causal-chain:first-child { padding-top: 0; }
        .causal-chain:last-child { border-bottom: none; padding-bottom: 0; }
        .causal-step {
            font-size: 14px; line-height: 1.65;
            display: flex; align-items: baseline; gap: 8px;
        }
        .causal-step + .causal-step { margin-top: 6px; }
        .causal-arrow { color: var(--text-muted); flex-shrink: 0; font-size: 12px; }
        .causal-cause  { color: var(--text); font-weight: 600; }
        .causal-effect { color: var(--accent); font-weight: 600; }

        /* 症状 */
        .symptom-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .symptom-tag {
            padding: 4px 12px; border-radius: var(--radius-pill);
            font-size: 11px; background: rgba(248,113,113,0.06);
            color: var(--red); border: 1px solid rgba(248,113,113,0.1);
        }

        /* 建议 */
        .suggestion {
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            display: flex; gap: 12px; align-items: flex-start;
        }
        .suggestion:first-child { padding-top: 0; }
        .suggestion:last-child { border-bottom: none; padding-bottom: 0; }
        .suggestion-num {
            width: 24px; height: 24px; border-radius: 50%;
            background: rgba(96,165,250,0.1); color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; flex-shrink: 0;
        }
        .suggestion-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; padding-top: 2px; }

        /* 详细分析 */
        .analysis-text {
            font-size: 13px; color: var(--text-secondary); line-height: 1.8;
        }
        .analysis-text p { margin-bottom: 12px; }
        .analysis-text p:last-child { margin-bottom: 0; }

        .empty-state {
            font-size: 13px; color: var(--text-muted);
            padding: 24px; text-align: center;
            background: rgba(255,255,255,0.01); border-radius: var(--radius);
        }

        /* ===== 底部信息条 ===== */
        .infobar {
            display: flex; align-items: center; gap: 28px;
            padding: 12px 20px;
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 11px; color: var(--text-muted);
        }
        .infobar-stat { display: flex; align-items: center; gap: 6px; }
        .infobar-stat strong {
            font-family: 'Geist Mono', 'SF Mono', monospace;
            font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
            font-variant-numeric: tabular-nums;
        }
        .infobar-stat strong.good { color: var(--green); }
        .infobar-stat strong.warn { color: var(--yellow); }
        .infobar-stat strong.bad  { color: var(--red); }
        .infobar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        .infobar-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        /* 基线对比 */
        .baseline-row {
            display: flex; gap: 24px; flex-wrap: wrap;
            font-size: 11px; color: var(--text-muted);
        }
        .baseline-item { display: flex; align-items: center; gap: 4px; }
        .baseline-arrow { font-weight: 700; font-family: 'Geist Mono', monospace; }
        .baseline-arrow.up   { color: var(--green); }
        .baseline-arrow.down { color: var(--red); }
        .baseline-arrow.flat { color: var(--text-muted); }

        /* 骨架屏 */
        .skel {
            background: linear-gradient(90deg, #1c1c21 25%, #25252d 50%, #1c1c21 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        .skel-line { height: 12px; margin-bottom: 8px; }
        .skel-line-sm { height: 10px; width: 50%; }

        /* toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 10px 18px; border-radius: var(--radius);
            font-size: 12px; font-weight: 600;
            background: var(--bg-raised); border: 1px solid var(--border-strong);
            color: var(--text); opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none; z-index: 200;
        }
        .toast.show { opacity: 1; }
        .toast.ok  { border-color: rgba(52,211,153,0.3); color: var(--green); }
        .toast.err { border-color: rgba(248,113,113,0.3); color: var(--red); }

        /* 响应式 */
        @media (max-width: 768px) {
            .content { padding: 16px 12px 32px; gap: 20px; }
            .report-head { padding: 24px 20px 20px; flex-direction: column; gap: 16px; }
            .report-status-value { font-size: 32px; }
            .report-signals { margin: 0 20px; }
            .report-body { padding: 0 20px 24px; grid-template-columns: 1fr; gap: 20px; }
            .infobar { flex-wrap: wrap; gap: 14px; }
            .infobar-stat strong { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .skel { animation: none; }
            .dot.loading { animation: none; }
        }
    </style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
    <div class="topbar-left">
        <div class="topbar-logo">S</div>
        <div class="topbar-title">AI 运维台</div>
    </div>
    <div class="topbar-right">
        <span id="lastRefresh">--</span>
        <span class="dot" id="statusDot"></span>
        <button class="btn btn-ghost" id="autoToggle" onclick="toggleAutoRefresh()">
            <span id="autoLabel">自动</span>
            <span class="auto-tag off" id="autoBadge">OFF</span>
        </button>
        <button class="btn btn-pri" onclick="refreshAll()">刷新</button>
    </div>
</header>

<!-- ===== 内容 ===== -->
<div class="content">

    <!-- ===== AI 诊断报告 ===== -->
    <div class="report" id="report">
        <!-- 报告头 -->
        <div class="report-head">
            <div class="report-status-col">
                <div class="report-status-label">诊断结论</div>
                <div class="report-status-value status-UNKNOWN" id="aiStatus">--</div>
                <div class="report-status-secondary" id="aiSecondary"></div>
            </div>
            <div class="report-actions">
                <button class="btn btn-pri" id="aiBtn" onclick="analyzeAi()">AI 诊断</button>
            </div>
        </div>

        <!-- 信号灯 -->
        <div class="report-signals" id="aiSignals">
            <span class="report-signals-label">即时信号</span>
            <span class="skel skel-line-sm" style="width:160px;margin:0">&nbsp;</span>
        </div>

        <!-- 报告正文 -->
        <div class="report-body" id="aiBody">
            <div>
                <div class="report-section-title">因果链</div>
                <div id="causalChains">
                    <span class="skel skel-line" style="width:90%">&nbsp;</span>
                    <span class="skel skel-line" style="width:80%">&nbsp;</span>
                </div>
                <div class="report-section-title" style="margin-top:24px">关键症状</div>
                <div id="keySymptoms">
                    <span class="skel skel-line" style="width:70%">&nbsp;</span>
                </div>
            </div>
            <div>
                <div class="report-section-title">建议措施</div>
                <div id="suggestions">
                    <span class="skel skel-line" style="width:85%">&nbsp;</span>
                    <span class="skel skel-line" style="width:75%">&nbsp;</span>
                </div>
                <div class="report-section-title" style="margin-top:24px">详细分析</div>
                <div id="aiReason">
                    <span class="skel skel-line" style="width:100%">&nbsp;</span>
                    <span class="skel skel-line" style="width:95%">&nbsp;</span>
                    <span class="skel skel-line" style="width:85%">&nbsp;</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 底部信息条 ===== -->
    <div class="infobar" id="infobar">
        <!-- key numbers filled by JS -->
    </div>

    <!-- ===== 基线对比 ===== -->
    <div class="baseline-row" id="baselineRow" style="display:none"></div>

</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<script>
const METRICS_URL   = '/metrics/seckill';
const AI_URL        = '/metrics/ai/analyze';
const BASELINE_URL  = '/metrics/baseline';
const QUEUE_URL     = '/admin/health/queue';

let autoRefreshInterval = null;
const INTERVAL_SEC = 10;

// ===== 入口 =====
document.addEventListener('DOMContentLoaded', () => {
    fetchMetrics();
    fetchAiAnalysis();
    fetchBaseline();
    fetchQueueHealth();
});

async function refreshAll() {
    setLoading(true);
    await Promise.all([fetchMetrics(), fetchQueueHealth()]);
    setLoading(false);
    updateTimestamp();
}

function analyzeAi() {
    const btn = document.getElementById('aiBtn');
    btn.disabled = true; btn.textContent = '分析中...';
    fetchAiAnalysis().finally(() => { btn.disabled = false; btn.textContent = 'AI 诊断'; });
}

// ===== 数据获取 =====
async function fetchMetrics() {
    try {
        const r = await fetch(METRICS_URL);
        if (!r.ok) throw new Error(`${r.status}`);
        renderMetrics(await r.json());
    } catch(e) { console.error(e); }
}

async function fetchAiAnalysis() {
    try {
        const r = await fetch(AI_URL);
        if (!r.ok) throw new Error(`${r.status}`);
        renderAiReport(await r.json());
    } catch(e) { console.error(e); }
}

async function fetchBaseline() {
    try {
        const r = await fetch(BASELINE_URL);
        if (!r.ok) return;
        renderBaseline(await r.json());
    } catch(e) { /* optional */ }
}

async function fetchQueueHealth() {
    try {
        const r = await fetch(QUEUE_URL);
        if (r.ok) renderQueue(await r.json());
    } catch(e) {}
}

// ===== 渲染：底部信息条 =====
function renderMetrics(d) {
    const rt  = d.runtime_metrics || {};
    const dx  = d.diagnosis || {};

    const stats = [
        { label: '请求',  value: fmt(rt.total_requests),   cls: '' },
        { label: '成交',  value: fmt(rt.order_success),    cls: rt.order_success > 0 ? 'good' : '' },
        { label: '库存失败', value: fmt(rt.stock_fail),    cls: rt.stock_fail > 0 ? 'warn' : '' },
        { label: '拦截',  value: fmt(rt.duplicate_request), cls: '' },
        { label: '异常',  value: fmt(rt.infra_fail),       cls: rt.infra_fail > 0 ? 'bad' : 'good' },
        { label: '消费者', value: rt.consumer_alive ? 'UP' : 'DOWN', cls: rt.consumer_alive ? 'good' : 'bad' },
    ];

    document.getElementById('infobar').innerHTML = stats.map(s =>
        `<div class="infobar-stat">
            <strong class="${s.cls}">${s.value}</strong>
            <span>${s.label}</span>
        </div>`
    ).join('') + `<div class="infobar-right">
        <span class="infobar-label">PENDING</span>
        <strong id="qPending">--</strong>
        <span class="infobar-label">死信</span>
        <strong id="qDead">--</strong>
        <button class="btn btn-ghost" onclick="opsReset()" title="重置指标">重置</button>
        <button class="btn btn-ghost" onclick="opsReplay()" title="重放死信">重放</button>
        <button class="btn btn-ghost" onclick="opsReconcile()" title="手动对账">对账</button>
    </div>`;

    // 信号灯
    renderSignals(dx);
}

// ===== 渲染：信号灯 =====
function renderSignals(dx) {
    const ctx = (dx || {}).ai_context || {};
    const symptoms = ctx.symptoms || [];
    const biz = ctx.business_features || {};

    const map = {
        'commit_drop_detected': { l:'DB 落库损耗', c:'warn' },
        'redis_stock_pressure': { l:'Redis 库存压力', c:'warn' },
        'infra_error_detected': { l:'基础设施异常', c:'bad' },
    };

    let html = '<span class="report-signals-label">即时信号</span>';
    if (symptoms.length) {
        html += symptoms.map(s => {
            const m = map[s] || { l:s, c:'ok' };
            return `<span class="signal ${m.c}">${m.l}</span>`;
        }).join('');
    } else {
        html += '<span class="signal ok">系统正常</span>';
    }
    if (biz.stock_exhausted_signal) html += '<span style="font-size:10px;color:var(--yellow)">库存耗尽</span>';
    if (biz.commit_drop_signal)    html += '<span style="font-size:10px;color:var(--orange)">链路损耗</span>';
    document.getElementById('aiSignals').innerHTML = html;
}

// ===== 渲染：AI 报告 =====
function renderAiReport(d) {
    const status = (d.primary_status || 'UNKNOWN').toUpperCase();

    // 大状态
    const statusEl = document.getElementById('aiStatus');
    statusEl.textContent = statusLabel(status);
    statusEl.className = `report-status-value status-${status}`;

    // 次级状态
    const sec = d.secondary_statuses || [];
    const secEl = document.getElementById('aiSecondary');
    secEl.textContent = sec.map(s => secLabel(s)).join('  ');

    // 因果链
    const chains = d.causal_chains || [];
    const chainsEl = document.getElementById('causalChains');
    if (chains.length) {
        chainsEl.innerHTML = chains.map(c => {
            const parts = c.split('→').map(p => p.trim());
            if (parts.length >= 3) {
                return `<div class="causal-chain">
                    <div class="causal-step"><span class="causal-cause">${esc(parts[0])}</span></div>
                    <div class="causal-step"><span class="causal-arrow">↓</span><span style="color:var(--text-secondary)">${esc(parts.slice(1,-1).join(' → '))}</span></div>
                    <div class="causal-step"><span class="causal-arrow">↓</span><span class="causal-effect">${esc(parts[parts.length-1])}</span></div>
                </div>`;
            }
            return `<div class="causal-chain"><div class="causal-step" style="color:var(--text-secondary)">${esc(c)}</div></div>`;
        }).join('');
    } else {
        chainsEl.innerHTML = '<div class="empty-state">运行压测后点击"AI 诊断"，DeepSeek 将自动推理因果链</div>';
    }

    // 关键症状
    const symptoms = d.key_symptoms || [];
    document.getElementById('keySymptoms').innerHTML = symptoms.length
        ? `<div class="symptom-list">${symptoms.map(s => `<span class="symptom-tag">${esc(s)}</span>`).join('')}</div>`
        : '<div class="empty-state">无异常症状</div>';

    // 建议
    const sugs = d.suggestion || [];
    document.getElementById('suggestions').innerHTML = sugs.length
        ? sugs.map((s,i) => `<div class="suggestion"><div class="suggestion-num">${i+1}</div><div class="suggestion-text">${esc(s)}</div></div>`).join('')
        : '<div class="empty-state">运行压测后点击"AI 诊断"获取建议</div>';

    // 详细分析
    const reason = d.reason || '';
    document.getElementById('aiReason').innerHTML = reason
        ? `<div class="analysis-text">${reason.split('\n').filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('')}</div>`
        : '<div class="empty-state">点击"AI 诊断"生成详细分析报告</div>';
}

// ===== 基线对比 =====
function renderBaseline(d) {
    if (!d.exists || !d.snapshot) return;
    const snap = d.snapshot;
    const row = document.getElementById('baselineRow');
    row.style.display = 'flex';

    const items = [
        { k:'total_requests',    l:'请求' },
        { k:'order_success',     l:'成交' },
        { k:'stock_fail',        l:'库存失败' },
        { k:'duplicate_request', l:'拦截' },
        { k:'infra_fail',        l:'异常' },
    ];

    row.innerHTML = '<span style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted)">vs 上次基线</span>' +
        items.map(it => {
            const prev = parseFloat(snap[it.k]);
            if (isNaN(prev)) return '';
            const cur = parseFloat(snap[it.k + '_cur']); // not available here, just show prev
            return `<span class="baseline-item">
                <span style="color:var(--text-muted)">${it.l}</span>
                <span style="font-family:Geist Mono,SF Mono,monospace;font-size:12px;font-weight:600">${fmt(prev)}</span>
            </span>`;
        }).join('');
}

// ===== 队列数据更新 =====
let lastMetricsData = null;
function renderQueue(d) {
    const p = d.stream_pending;
    const dead = d.dead_letter_size;
    const elP = document.getElementById('qPending');
    const elD = document.getElementById('qDead');
    if (elP) {
        elP.textContent = p != null ? fmt(p) : '--';
        elP.className = p > 1000 ? 'bad' : (p > 500 ? 'warn' : 'good');
    }
    if (elD) {
        elD.textContent = dead != null ? fmt(dead) : '--';
        elD.className = dead > 100 ? 'bad' : (dead > 10 ? 'warn' : 'good');
    }
}

// ===== 运维操作 =====
async function ops(url, label) {
    const t = document.getElementById('toast');
    try {
        let adminToken = sessionStorage.getItem('hmdpAdminToken');
        if (!adminToken) {
            adminToken = prompt('请输入管理员令牌');
            if (!adminToken) return;
            sessionStorage.setItem('hmdpAdminToken', adminToken);
        }
        const r = await fetch(url, {
            method:'POST',
            headers: { 'X-Admin-Token': adminToken }
        });
        if (r.status === 403) sessionStorage.removeItem('hmdpAdminToken');
        const d = await r.json();
        t.textContent = d.success ? `${label} 完成` : `${label} 失败: ${d.message||d.errorMsg||''}`;
        t.className = d.success ? 'toast ok show' : 'toast err show';
    } catch(e) {
        t.textContent = `${label} 异常`;
        t.className = 'toast err show';
    }
    setTimeout(() => t.className = 'toast', 2500);
    setTimeout(refreshAll, 600);
}
function opsReset()     { if(confirm('重置所有秒杀指标计数器？')) ops('/admin/metrics/reset', '指标重置'); }
function opsReplay()    { if(confirm('重放所有死信消息到主 Stream？可能重复消费。')) ops('/admin/dead-letter/replay', '死信重放'); }
function opsReconcile() { ops('/admin/reconcile/trigger', '手动对账'); }

// ===== 工具 =====
function fmt(v) {
    if (v == null || isNaN(v)) return '--';
    return Number(v).toLocaleString('zh-CN', { maximumFractionDigits:1 });
}
function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s; return d.innerHTML;
}
function statusLabel(s) {
    const m = { NORMAL:'系统正常', SATURATED:'资源饱和', DEGRADED:'性能降级', INFRA_FAIL:'基础设施故障', CRITICAL:'严重故障', UNKNOWN:'--' };
    return m[s] || s;
}
function secLabel(s) {
    const m = { DEGRADING:'恶化中', IMPROVING:'改善中', STABLE:'持平' };
    return m[s] ? '· ' + m[s] : '';
}

// ===== UI =====
function setLoading(v) {
    document.getElementById('statusDot').className = 'dot' + (v ? ' loading' : '');
}
function updateTimestamp() {
    document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString('zh-CN', { hour12:false });
    document.getElementById('statusDot').className = 'dot';
}
function toggleAutoRefresh() {
    const tag = document.getElementById('autoBadge');
    const label = document.getElementById('autoLabel');
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval); autoRefreshInterval = null;
        tag.textContent = 'OFF'; tag.className = 'auto-tag off'; label.textContent = '自动';
    } else {
        autoRefreshInterval = setInterval(refreshAll, INTERVAL_SEC * 1000);
        tag.textContent = INTERVAL_SEC + 's'; tag.className = 'auto-tag'; label.textContent = '自动';
    }
}
</script>

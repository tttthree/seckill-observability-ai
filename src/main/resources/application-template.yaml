server:
  port: 8081
spring:
  application:
    name: seckill-observability
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hmdp}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  task:
    scheduling:
      # 秒杀对账与故障状态检测器是两个独立定时任务，避免互相排队等待
      pool:
        size: 2
mybatis-plus:
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: debug
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

seckill:
  consumer:
    threads: 3
    batch-size: 20
  retry:
    max: 3
  reconcile:
    fixed-delay-ms: 300000
  load-model:
    concurrency: 2000
    stock: 400
  pending-handler:
    enabled: true
    interval-ms: 5000
    batch-size: 50
    consumer-name: pending-handler
    grace-period-ms: 5000
  sentinel:
    metrics-qps: 20
    ai-analyze-qps: 1
  ai:
    baseline-enabled: true
    baseline-key: seckill:metrics:baseline
  incident:
    # 故障事件层：统一记录对账偏差、死信、消费者不健康
    enabled: true
    # 状态检测器轮询间隔（毫秒）：只读取既有检测结果驱动 OPEN/UPDATE/RESOLVE，不做阈值判断
    detector-interval-ms: 30000
    default-list-limit: 50
    max-list-limit: 200

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  url: https://api.deepseek.com/v1/chat/completions

admin:
  # 后台运维和秒杀券配置接口通过 X-Admin-Token 请求头校验。
  token: ${ADMIN_TOKEN:}

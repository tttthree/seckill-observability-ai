server:
  port: 8081
spring:
  application:
    name: seckill-observability
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hmdp}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  task:
    scheduling:
      # 秒杀对账与故障状态检测器是两个独立定时任务，避免互相排队等待
      pool:
        size: 2
mybatis-plus:
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: debug
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

seckill:
  consumer:
    threads: 3
    batch-size: 20
  retry:
    max: 3
  reconcile:
    fixed-delay-ms: 300000
  load-model:
    concurrency: 2000
    stock: 400
  pending-handler:
    enabled: true
    interval-ms: 5000
    batch-size: 50
    consumer-name: pending-handler
    grace-period-ms: 5000
  sentinel:
    metrics-qps: 20
    ai-analyze-qps: 1
  ai:
    baseline-enabled: true
    baseline-key: seckill:metrics:baseline
  incident:
    # 故障事件层：统一记录对账偏差、死信、消费者不健康
    enabled: true
    # 状态检测器轮询间隔（毫秒）：只读取既有检测结果驱动 OPEN/UPDATE/RESOLVE，不做阈值判断
    detector-interval-ms: 30000
    default-list-limit: 50
    max-list-limit: 200

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  url: https://api.deepseek.com/v1/chat/completions

# V2-4：Java → Python 结构化诊断服务的调用可靠性（GET /admin/incidents/{id}/diagnosis）
ai-diagnosis:
  # false 时客户端直接本地降级（AI_SERVICE_DISABLED），不发起任何 HTTP 调用
  enabled: true
  # Python V2-3 诊断端点；Java 主系统端口为 8081，Python 默认 8000
  url: ${AI_DIAGNOSIS_URL:http://127.0.0.1:8000/api/v1/diagnosis}
  # 连接超时（可重试）
  connect-timeout-ms: 2000
  # 读取超时：必须大于 Python 侧 deepseek_timeout_seconds(40s)；读取超时**不重试**
  read-timeout-ms: 45000
  # 最多尝试次数 = 1 次调用 + 最多 1 次额外重试
  max-attempts: 2
  # 诊断接口 Sentinel 限流 QPS（复用既有 Sentinel，不引入新限流框架）
  qps: 1

admin:
  # 后台运维和秒杀券配置接口通过 X-Admin-Token 请求头校验。
  token: ${ADMIN_TOKEN:}

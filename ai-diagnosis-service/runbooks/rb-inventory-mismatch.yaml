id: rb-inventory-mismatch
title: 库存不一致（Redis vs MySQL）处置手册
version: "2"
updated_at: 2026-09-24
incident_types:
  - INVENTORY_MISMATCH
match_signals:
  - snapshot:deviation_positive
  - counter_present:reconcile_mismatch
  - counter_positive:reconcile_mismatch
  - redis:mismatch_marker_present
  - redis:dirty_vouchers_present
keywords:
  - 库存
  - 对账
  - redisStock
  - dbStock
  - deviation
  - 超卖
  - 脏券
  - mismatch
summary: 两阶段对账确认的 Redis 与 MySQL 库存持续不一致。系统只记录与告警、不会自动覆盖库存，必须人工核对后再处置。
checks:
  - 对比 incident.detected_snapshot（检测时刻证据）与 redis / database 两段（构建时刻状态）的库存值，判断偏差在构建时刻是否仍然存在。
  - 核对 database.order_count_for_voucher 与 Redis 已下单用户基数是否一致，排查超卖或订单漏记。
  - 检查 seckill:reconcile:mismatch:<voucherId> 标记在构建时刻是否存在（present=false 只表示当时未观察到该标记；Context 不提供它的历史清除时间，不得据此推断被误删）。
  - 结合 incident.status 与 first_detected_at / last_detected_at / resolved_at 时间线，判断该事件是否已由对账恢复。
do_not:
  - 禁止用任何方式自动覆盖 Redis 或 MySQL 库存：对账只记录与告警，不执行修复。
  - 禁止在缺少两端同时刻证据时把偏差归因于某个组件。
references:
  - ARCHITECTURE.md#5-一致性边界
  - alert.rules.yml#InventoryReconcileMismatch
